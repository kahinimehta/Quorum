# Publishes built Jekyll site to https://neurodiscover.github.io (org Pages root).
# Requires repo neurodiscover/neurodiscover.github.io (public) and secret
# NEURODISCOVER_PAGES_TOKEN (classic PAT scope: repo — or fine-grained Contents: read/write).

name: Deploy docs to neurodiscover.github.io

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-neurodiscover-org-pages.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quorum
        uses: actions/checkout@v4
        with:
          # Required for cross-repo deploy — otherwise checkout's GITHUB_TOKEN wins over PAT.
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build with Jekyll
        working-directory: docs
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify build output
        run: test -f docs/_site/index.html

      - name: Deploy to neurodiscover.github.io
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.NEURODISCOVER_PAGES_TOKEN }}
          repository-name: neurodiscover/neurodiscover.github.io
          branch: main
          folder: docs/_site
          clean: true
          single-commit: true
          commit-message: "Deploy docs from kahinimehta/Quorum@${{ github.sha }}"
