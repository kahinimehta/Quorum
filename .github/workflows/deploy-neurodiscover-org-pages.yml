# Publishes docs/ to https://neurodiscover.github.io (org/user Pages root).
# Requires GitHub org/user "neurodiscover" and repo "neurodiscover.github.io".
# Add repository secret NEURODISCOVER_PAGES_TOKEN (PAT with contents:write on that repo).

name: Deploy docs to neurodiscover.github.io

# Run manually until NEURODISCOVER_PAGES_TOKEN is configured (Actions → Run workflow).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy docs folder to neurodiscover.github.io
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.NEURODISCOVER_PAGES_TOKEN }}
          repository-name: neurodiscover/neurodiscover.github.io
          branch: main
          folder: docs
          clean: true
          single-commit: true
          commit-message: "Deploy docs from kahinimehta/Quorum@${{ github.sha }}"
