# Publishes built Jekyll site to https://neurodiscover.github.io (org Pages root).
# Requires repo neurodiscover/neurodiscover.github.io (public) and secret
# NEURODISCOVERY_DOCS (classic PAT scope: repo — or fine-grained Contents: read/write).
#
# If deploy fails with git exit 128:
#   1. Secret NEURODISCOVERY_DOCS must be set on kahinimehta/Quorum
#   2. Classic PAT: scope "repo" — OR fine-grained: Contents read/write on neurodiscover.github.io
#   3. Token creator must be org owner; authorize SSO for neurodiscover org if prompted
#   4. repository-name must be neurodiscover/neurodiscover.github.io (no typos)

name: Deploy docs to neurodiscover.github.io

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-neurodiscover-org-pages.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quorum
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build with Jekyll
        working-directory: docs
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify build output
        run: test -f docs/_site/index.html

      - name: Push built site to neurodiscover.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.NEURODISCOVERY_DOCS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::NEURODISCOVERY_DOCS is not set. Add it under Quorum → Settings → Secrets → Actions."
            exit 1
          fi
          cd docs/_site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy docs from kahinimehta/Quorum@${GITHUB_SHA}"
          git branch -M main
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/neurodiscover/neurodiscover.github.io.git"
          git push --force origin main
