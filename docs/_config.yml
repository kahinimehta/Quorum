title: NeuroDiscover AI
description: >-
  Agentic commercial development discovery — hidden patient subgroups,
  evidence-linked treatment connections, and ranked portfolio opportunities.
theme: just-the-docs

url: https://neurodiscover.github.io
baseurl: ""

permalink: pretty

logo: "/assets/images/neurodiscover-ai-logo.png"

favicon_ico: "/assets/images/favicon.png"

twitter:
  card: summary_large_image

color_scheme: neurodiscover

callouts:
  highlight:
    title: Highlight
    color: yellow
  important:
    title: Important
    color: blue
  warning:
    title: Warning
    color: red

aux_links:
  GitHub:
    - "https://github.com/kahinimehta/Quorum"
  Dashboard (local):
    - "https://github.com/kahinimehta/Quorum/tree/main/neurodiscover/frontend"

footer_content: "NeuroDiscover · Quorum · Track 02 Autonomous Research · Final Showcase June 6, 2025"

mermaid:
  version: "10.6.1"

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - node_modules
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/neurodiscover-ai-logo.png
